<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="arx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="arx-beam-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="arx-beam-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="arx-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="arx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect width="40" height="40" rx="10" fill="url(#arx-bg)" stroke="#262b3a" stroke-width="1.5"/>

  <!-- Left Leg of A -->
  <path d="M11 31 L20 9 L24 16 L16 31 Z" fill="url(#arx-beam-left)"/>

  <!-- Right Leg of A -->
  <path d="M29 31 L20 9 L23 9 L31 27 Z" fill="url(#arx-beam-right)"/>

  <!-- Floating Apex Diamond Node -->
  <polygon points="20,16 24.5,22 20,27 15.5,22" fill="url(#arx-spark)" filter="url(#arx-glow)"/>

  <!-- Core Precision Spark -->
  <circle cx="20" cy="21.5" r="1.5" fill="#ffffff"/>
</svg>
