<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-priya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="60"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <rect width="120" height="120" fill="url(#bg-priya)"/>
    <!-- Shoulders / Berkeley Navy & Gold Blazer -->
    <path d="M22 120 Q60 88 98 120" fill="#1e293b"/>
    <path d="M42 120 L52 98 L68 98 L78 120" fill="#fcd34d"/>
    <!-- Neck -->
    <rect x="52" y="70" width="16" height="20" rx="3" fill="#d97706"/>
    <!-- High Ponytail Top -->
    <ellipse cx="60" cy="22" rx="10" ry="12" fill="#1e1b4b"/>
    <ellipse cx="60" cy="28" rx="6" ry="4" fill="#fbbf24"/>
    <!-- Head Base -->
    <ellipse cx="60" cy="58" rx="21" ry="24" fill="#d97706"/>
    <!-- Sleek Parted Hair -->
    <path d="M39 52 Q40 32 60 30 Q80 32 81 52 Q76 40 60 40 Q44 40 39 52 Z" fill="#1e1b4b"/>
    <path d="M39 52 Q42 66 43 74 Q39 64 39 52 Z" fill="#1e1b4b"/>
    <path d="M81 52 Q78 66 77 74 Q81 64 81 52 Z" fill="#1e1b4b"/>
    <!-- Wireframe Round Glasses -->
    <circle cx="48" cy="56" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="72" cy="56" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="56" y1="56" x2="64" y2="56" stroke="#fbbf24" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="48" cy="56" r="2.2" fill="#0f172a"/>
    <circle cx="72" cy="56" r="2.2" fill="#0f172a"/>
    <!-- Confident Smile -->
    <path d="M54 69 Q60 74 66 69" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Mini Algorithm Matrix / Berkeley Badge -->
    <circle cx="96" cy="24" r="14" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2"/>
    <text x="96" y="28" font-size="11" font-family="monospace" font-weight="bold" fill="#fde68a" text-anchor="middle">&lt;&gt;</text>
  </g>
</svg>
