      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="60"/>
