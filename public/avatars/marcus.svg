    <path d="M38 48 Q40 28 60 26 Q80 28 82 48 Q76 38 60 38 Q44 38 38 48 Z" fill="#18181b"/>
    <path d="M46 32 L48 24 L52 30 L56 22 L60 28 L64 22 L68 30 L72 24 L74 32" stroke="#18181b" stroke-width="3" fill="none" stroke-linejoin="round"/>
