    <rect x="42" y="52" width="14" height="9" rx="2" fill="none" stroke="#71717a" stroke-width="2"/>
    <rect x="64" y="52" width="14" height="9" rx="2" fill="none" stroke="#71717a" stroke-width="2"/>
    <line x1="56" y1="56" x2="64" y2="56" stroke="#71717a" stroke-width="2"/>
